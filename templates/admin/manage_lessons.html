<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Lessons</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #343a40, #212529);
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #495057;
            color: #fff;
        }
        .table-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <h4 class="text-white text-center py-4">Admin Panel</h4>
            <a href="{{ url_for('admin.dashboard') }}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a href="{{ url_for('admin.manage_courses') }}"><i class="bi bi-journal-bookmark me-2"></i>Courses</a>
            <a href="{{ url_for('admin.manage_lessons') }}" class="active"><i class="bi bi-file-earmark-text me-2"></i>Lessons</a>
            <a href="{{ url_for('admin.manage_notes') }}">
                <i class="bi bi-stickies me-2"></i>Notes
            </a>

            <a href="{{ url_for('admin.manage_quizzes') }}">
                <i class="bi bi-card-checklist me-2"></i>Quizzes
            </a>
            <a href="{{ url_for('admin.external_courses') }}"><i class="bi bi-link-45deg me-2"></i>External Courses</a>
           
            <a href="{{ url_for('admin.admin_logout') }}" class="text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Manage AI Lessons</h3>
            </div>

            <div class="table-card p-4">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Content</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for lesson in lessons %}
                        <tr>
                            <td>{{ lesson.id }}</td>
                            <td class="fw-semibold">{{ lesson.title }}</td>
                            <td style="max-width:450px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                {{ lesson.content }}
                            </td>
                            <td>
                                <a href="{{ url_for('admin.delete_lesson', lesson_id=lesson.id) }}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Are you sure you want to delete this lesson?')">
                                   <i class="bi bi-trash"></i> Delete
                                </a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">No lessons found</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
