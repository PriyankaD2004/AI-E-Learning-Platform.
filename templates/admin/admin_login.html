<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | AI Learning Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0a0f24, #001a2c);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', sans-serif;
        color: #fff;
    }

    /* Card */
    .login-card {
        width: 380px;
        padding: 35px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 40px rgba(0, 255, 255, 0.25);
        animation: fadeIn 1s ease;
    }

    .login-card h3 {
        color: cyan;
        font-weight: 700;
        text-align: center;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        font-size: 0.95rem;
        opacity: 0.8;
        margin-bottom: 25px;
    }

    /* Inputs */
    .form-control {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(0,255,255,0.3);
        color: #fff;
        border-radius: 12px;
        padding: 12px;
    }

    .form-control::placeholder {
        color: rgba(255,255,255,0.6);
    }

    .form-control:focus {
        background: rgba(255,255,255,0.12);
        border-color: cyan;
        box-shadow: 0 0 10px rgba(0,255,255,0.5);
        color: #fff;
    }

    /* Button */
    .btn-login {
        background: cyan;
        border: none;
        color: #00131c;
        font-weight: 600;
        padding: 12px;
        border-radius: 50px;
        transition: 0.3s ease;
    }

    .btn-login:hover {
        background: #00eaff;
        transform: scale(1.03);
    }

    /* Footer link */
    .signup-link {
        text-align: center;
        margin-top: 18px;
        font-size: 0.9rem;
    }

    .signup-link a {
        color: cyan;
        text-decoration: none;
    }

    .signup-link a:hover {
        text-decoration: underline;
    }

    /* Animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="login-card">
    <h3>Admin Login</h3>
    <p class="subtitle">Secure access to admin dashboard</p>

    <form method="POST">
        <input type="text" name="username" class="form-control mb-3" placeholder="Admin Username" required>
        <input type="password" name="password" class="form-control mb-4" placeholder="Password" required>

        <button type="submit" class="btn btn-login w-100">Login</button>
    </form>

    <div class="signup-link">
        Don’t have admin access?
        <a href="{{ url_for('admin.admin_signup') }}">Create Admin</a>

    </div>
</div>

</body>
</html>
