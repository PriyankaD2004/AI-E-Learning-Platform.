<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 AI Quiz Generator</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Poppins", sans-serif;
    }
    .answer {
      display: none;
      background: #eef8f3;
      border-left: 4px solid #28a745;
      padding: 10px;
      margin-top: 8px;
      border-radius: 5px;
    }
    .card {
      border-radius: 10px;
    }
    .spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    .correct-option {
      background: #d4edda !important;
      padding: 6px;
      border-radius: 6px;
      font-weight: 600;
      border-left: 4px solid green;
    }
    .option-box {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <h2 class="text-center mb-4">🧠 AI Quiz Generator</h2>

  <div class="card shadow p-4">
    <form id="quiz-form">
      <input type="text" id="topic" class="form-control mb-3" placeholder="Enter topic (e.g. Python loops)" required>
      <input type="number" id="num_questions" class="form-control mb-3" value="5" min="1" max="10" required>
      <button type="submit" class="btn btn-primary w-100">Generate Quiz</button>
    </form>

    <div id="quiz-output" class="mt-4"></div>
  </div>

  <div class="mt-3 text-center">
    <a class="btn btn-secondary" href="{{ url_for('student.dashboard') }}">⬅ Back to Dashboard</a>
  </div>
</div>

<script>
let quizData = [];

document.getElementById('quiz-form').addEventListener("submit", async function(e) {
  e.preventDefault();
  const topic = document.getElementById('topic').value.trim();
  const numQ = parseInt(document.getElementById('num_questions').value.trim());
  const output = document.getElementById('quiz-output');

  output.innerHTML = `
    <div class="spinner-container mt-4">
      <div class="spinner-border" role="status"></div>
      <p class="text-muted">Generating quiz... Please wait...</p>
    </div>
  `;

  try {
    const res = await fetch("{{ url_for('student.generate_quiz_api') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: topic, num_questions: numQ })
    });

    const data = await res.json();
    console.log("📌 API Response:", data);

    if (!res.ok || !data.quiz) {
      output.innerHTML = `<p class="text-danger text-center">❌ ${data.error || "Failed to generate quiz"}</p>`;
      return;
    }

    if (!Array.isArray(data.quiz)) {
      output.innerHTML = "<p class='text-danger text-center'>❌ Invalid quiz format received</p>";
      return;
    }

    quizData = data.quiz;
    renderQuiz();

  } catch (err) {
    console.error("🔥 Fetch Error:", err);
    output.innerHTML = "<p class='text-danger text-center'>❌ Network / Server error</p>";
  }
});

function renderQuiz() {
  const output = document.getElementById("quiz-output");
  let html = "";

  quizData.forEach((q, i) => {
    html += `<div class="mb-4">
      <h5><b>Q${i + 1}.</b> ${q.question}</h5>
      ${q.options.map((opt, idx) => `
          <div class="form-check option-box">
              <input class="form-check-input" type="radio" name="q${i}" value="${opt}" id="q${i}_${idx}">
              <label class="form-check-label" for="q${i}_${idx}">${opt}</label>
          </div>`).join("")}

      <div class="answer mt-3" id="ans${i}">
          <b>✅ Correct Answer:</b> ${q.correct_answer}<br>
          <b>💡 Explanation:</b> ${q.explanation || "No explanation provided."}
      </div>
    </div><hr>`;
  });

  html += `<div class="text-center">
      <button id="submitQuizBtn" class="btn btn-success">Submit Quiz</button>

      <div id="scoreBox" class="mt-3 p-3 border rounded bg-light shadow-sm" style="display:none;">
          <h5>🎯 Your Score: <span id="score"></span></h5>
          <button id="viewMoreBtn" class="btn btn-info mt-2">View Answers & Explanation</button>
      </div>
  </div>`;

  output.innerHTML = html;

  document.getElementById("submitQuizBtn").addEventListener("click", calculateScore);
  document.getElementById("viewMoreBtn")?.addEventListener("click", showAnswersAndExplain);
}

function calculateScore() {
  let score = 0;
  quizData.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (selected && selected.value === q.correct_answer) score++;
  });

  document.getElementById("score").innerText = `${score} / ${quizData.length}`;
  document.getElementById("scoreBox").style.display = "block";
  document.getElementById("submitQuizBtn").disabled = true;
}

function showAnswersAndExplain() {
  quizData.forEach((q, i) => {
    document.querySelectorAll(`input[name="q${i}"]`).forEach(input => {
      const label = input.parentElement;
      if (input.value === q.correct_answer) {
          label.classList.add("correct-option");
      }
      input.disabled = true;
    });

    document.getElementById(`ans${i}`).style.display = "block";
  });

  document.getElementById("viewMoreBtn").disabled = true;
}
</script>

</body>
</html>
