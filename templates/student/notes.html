<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Generated Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <h1 class="mb-4 text-center">📝 AI Generated Notes</h1>

    <form id="notesForm" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="topic" class="form-label">Topic</label>
            <input type="text" id="topic" name="topic" class="form-control" placeholder="Enter a topic (e.g., Photosynthesis)">
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Generate Notes
        </button>
    </form>

    <div id="notesResult" class="mt-4"></div>
</div>

<div class="mt-4 text-center">
    <!-- FIXED ENDPOINT NAME -->
    <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">
        ⬅ Back to Dashboard
    </a>
</div>

<!-- JavaScript Notes API -->
<script>
document.getElementById('notesForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const topic = document.getElementById('topic').value.trim();
    if (!topic) return alert('⚠️ Please enter a topic.');

    const output = document.getElementById('notesResult');
    output.innerHTML = `<p class="text-muted">⏳ Generating notes... Please wait...</p>`;

    try {
        const response = await fetch("{{ url_for('student.api_generate_notes') }}", 
{
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic })
        });

        const data = await response.json();

        if (data.error) {
            output.innerHTML = `<p class="text-danger">❌ ${data.error}</p>`;
        } else {
            output.innerHTML = `
                <div class="card p-3 shadow-sm">
                    <h3>Notes for: <span class="text-primary">${topic}</span></h3>
                    <pre>${data.notes}</pre>

                    <a href="${data.download_url}" class="btn btn-success mt-2">
                        ⬇ Download Notes
                    </a>
                </div>
            `;
        }

    } catch (err) {
        console.error(err);
        output.innerHTML = `<p class="text-danger">❌ Error generating notes. Try again.</p>`;
    }
});
</script>

</body>
</html>
