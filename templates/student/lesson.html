<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Lesson Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4 text-center">AI Lesson Generator</h1>

    <!-- Input field -->
    <div class="mb-3">
        <input id="lesson_topic" class="form-control form-control-lg" placeholder="Enter lesson topic...">
    </div>

    <!-- Button -->
    <button id="generateLessonBtn" class="btn btn-primary btn-lg w-100">Generate Lesson</button>

    <!-- Loading -->
    <div id="loading" class="mt-4 text-secondary text-center" style="display:none;">
        <div class="spinner-border"></div> Generating lesson... Please wait.
    </div>

    <!-- Result -->
    <div id="result" class="mt-4"></div>

    <!-- Back Button -->
    <div class="mt-5 text-center">
        <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">
            ⬅ Back to Dashboard
        </a>
    </div>
</div>

<script>
document.getElementById("generateLessonBtn").onclick = async function () {
    const topic = document.getElementById("lesson_topic").value.trim();

    if (!topic) {
        document.getElementById("result").innerHTML =
            `<div class="alert alert-danger">Please enter a topic</div>`;
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("result").innerHTML = "";

    try {
        const response = await fetch("/student/generate_lesson", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ topic: topic })
        });

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error("Server returned HTML instead of JSON. Check your Flask route.");
        }

        document.getElementById("loading").style.display = "none";

        if (data.error) {
            document.getElementById("result").innerHTML =
                `<div class="alert alert-danger">${data.error}</div>`;
            return;
        }

        document.getElementById("result").innerHTML = `
            <div class="card p-4 shadow-sm">
                <h4 class="mb-3">Generated Lesson</h4>
                <pre class="bg-light p-3" style="white-space: pre-wrap; font-size: 1rem;">
${data.lesson}
                </pre>
            </div>
        `;
    } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("result").innerHTML =
            `<div class="alert alert-danger">Error: ${err.message}</div>`;
    }
};
</script>

</body>
</html>
