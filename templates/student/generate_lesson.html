<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Lesson</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm p-5">
        <h2 class="mb-4">Generate Lesson</h2>

        <label class="form-label">Enter Topic</label>
        <input id="lesson_topic" class="form-control form-control-lg" placeholder="Enter topic...">

        <button id="generateBtn" class="btn btn-primary btn-lg w-100 mt-4">
            Generate Lesson
        </button>

        <!-- Loading -->
        <div id="loading" class="mt-4 text-center" style="display:none;">
            <div class="spinner-border"></div>
            <p>Generating lesson... please wait.</p>
        </div>

        <!-- Result -->
        <div id="result" class="mt-4"></div>

        
    </div>
</div>

<script>
document.getElementById("generateBtn").onclick = async function () {
    const topic = document.getElementById("lesson_topic").value.trim();

    if (!topic) {
        document.getElementById("result").innerHTML =
            `<div class="alert alert-danger">Please enter a topic</div>`;
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("result").innerHTML = "";

    try {
        const response = await fetch("/student/generate_lesson", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ topic: topic })
        });

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error("Server returned HTML instead of JSON. Check Flask route.");
        }

        document.getElementById("loading").style.display = "none";

        if (data.error) {
            document.getElementById("result").innerHTML =
                `<div class="alert alert-danger">${data.error}</div>`;
            return;
        }

        document.getElementById("result").innerHTML = `
            <div class="card p-4 shadow-sm">
                <h4 class="mb-3">Generated Lesson</h4>
                <pre style="white-space: pre-wrap;">${data.lesson}</pre>
            </div>
        `;
    } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("result").innerHTML =
            `<div class="alert alert-danger">Error: ${err.message}</div>`;
    }
};
</script>
<div class="mt-5 text-center">
        <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">
            ⬅ Back to Dashboard
        </a>
    </div>

</body>
</html>
