<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Course Generator</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Background -->
    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/ai_avatar.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
    </style>
</head>

<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4 text-center">Courses</h1>

    <!-- Input -->
    <div class="mb-3">
        <input
            id="course_topic"
            class="form-control form-control-lg"
            placeholder="Enter topic..."
        >
    </div>

    <!-- Button -->
    <button
        id="generateBtn"
        class="btn btn-primary btn-lg w-100"
    >
        Generate Outline of Course
    </button>

    <!-- Loading -->
    <div
        id="loading"
        class="mt-4 text-secondary text-center"
        style="display:none;"
    >
        <div class="spinner-border"></div>
        <p class="mt-2">
            Generating course outline… Please wait.
        </p>
    </div>

    <!-- Result -->
    <div id="result" class="mt-4"></div>

    <!-- Back -->
    <div class="mt-5 text-center">
        <a href="{{ url_for('student.dashboard') }}" class="btn btn-secondary">
            ⬅ Back to Dashboard
        </a>
    </div>
</div>

<script>
document.getElementById("generateBtn").onclick = async function () {

    const topic = document.getElementById("course_topic").value.trim();
    const result = document.getElementById("result");
    const loading = document.getElementById("loading");

    if (!topic) {
        result.innerHTML =
            `<div class="alert alert-danger">Please enter a topic.</div>`;
        return;
    }

    loading.style.display = "block";
    result.innerHTML = "";

    try {
        const response = await fetch("/student/generate_courses", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic })
        });

        const raw = await response.text();
        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error("Server returned HTML instead of JSON.");
        }

        loading.style.display = "none";

        if (data.error) {
            result.innerHTML =
                `<div class="alert alert-danger">${data.error}</div>`;
            return;
        }

        const cleanText = data.course.replace(/\n/g, "<br>");

        result.innerHTML = `
            <div class="card p-4 shadow-sm">
                <h4 class="mb-3">Generated Course</h4>
                <div class="bg-light p-3 border rounded">
                    ${cleanText}
                </div>
            </div>
        `;

    } catch (err) {
        loading.style.display = "none";
        result.innerHTML =
            `<div class="alert alert-danger">Error: ${err.message}</div>`;
    }
};
</script>

</body>
</html>
